<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Nav & Profile Handoff</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; background: #f0eee9; overscroll-behavior: none; font-family: 'Inter', -apple-system, system-ui, sans-serif; color: #1e160f; }
  #root { width: 100%; min-height: 100vh; }
  .spec-num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: rgba(30,22,15,0.52); }
  .spec-k { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: rgba(30,22,15,0.85); }
  .cap { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: rgba(30,22,15,0.55); }
  .frame {
    position: relative; background: var(--bg); border: 1px solid #e4dfd4;
    border-radius: 16px; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 16px 40px rgba(30,22,15,0.08);
  }
  .label-pill {
    position: absolute; top: 12px; left: 12px; z-index: 50;
    padding: 4px 10px; background: rgba(30,22,15,0.88); color: #f6f2e9;
    border-radius: 99px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .anno {
    position: absolute; background: rgba(30,22,15,0.92); color: #f6f2e9;
    padding: 5px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 500;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap; z-index: 60;
    font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.02em;
  }
  .anno::before {
    content: ''; position: absolute; width: 10px; height: 10px;
    background: rgba(30,22,15,0.92); transform: rotate(45deg);
  }
  .anno.bottom::before { bottom: -4px; left: 50%; margin-left: -5px; }
  .anno.top::before { top: -4px; left: 50%; margin-left: -5px; }
  .anno.left::before { left: -4px; top: 50%; margin-top: -5px; }
  .anno.right::before { right: -4px; top: 50%; margin-top: -5px; }

  .section-head { padding: 0 48px; max-width: 1440px; margin: 0 auto; }
  .section-body { padding: 0 48px 56px; max-width: 1440px; margin: 0 auto; }

  h1.eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; color: var(--accent); margin: 0 0 12px; }
  h2.display { font-family: 'Instrument Serif', serif; font-size: 48px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 6px; }
  h3.sec { font-family: 'Instrument Serif', serif; font-size: 32px; font-weight: 400; letter-spacing: -0.015em; margin: 0 0 4px; color: #1e160f; }
  .sec-sub { font-size: 13.5px; color: rgba(30,22,15,0.65); max-width: 720px; line-height: 1.6; margin: 0; }
  .divider { height: 1px; background: linear-gradient(to right, transparent, #d8d2c4, transparent); margin: 32px 48px; max-width: 1440px; margin-left: auto; margin-right: auto; }

  table.spec { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.spec th, table.spec td { padding: 9px 12px; text-align: left; border-bottom: 1px solid #e4dfd4; }
  table.spec th { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(30,22,15,0.55); font-weight: 700; background: rgba(255,255,255,0.5); }
  table.spec td.k { font-family: 'JetBrains Mono', ui-monospace, monospace; color: rgba(30,22,15,0.72); width: 210px; }
  table.spec td.v { font-family: 'JetBrains Mono', ui-monospace, monospace; color: rgba(30,22,15,0.95); }

  .cover {
    position: relative;
    padding: 96px 48px 64px; max-width: 1440px; margin: 0 auto;
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: flex-end;
  }
  .cover-meta { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; color: rgba(30,22,15,0.55); letter-spacing: 0.08em; }
  .cover-title { font-family: 'Instrument Serif', serif; font-size: 88px; line-height: 0.95; letter-spacing: -0.03em; margin: 18px 0 0; }
  .cover-subtitle { font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1.15; letter-spacing: -0.015em; margin: 18px 0 0; color: rgba(30,22,15,0.78); font-style: italic; }
  .cover-toc { display: flex; flex-direction: column; gap: 14px; padding: 24px; background: #fbf9f4; border: 1px solid #e4dfd4; border-radius: 14px; }
  .cover-toc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; font-size: 13px; }
  .cover-toc-row .n { font-family: 'JetBrains Mono', ui-monospace, monospace; color: rgba(30,22,15,0.55); font-size: 11px; }
  .cover-toc-row .t { color: #1e160f; font-weight: 500; flex: 1; }
  .cover-toc-row .p { font-family: 'JetBrains Mono', ui-monospace, monospace; color: rgba(30,22,15,0.55); font-size: 11px; }

  .legend-row { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; font-size: 12px; color: rgba(30,22,15,0.78); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 99px; margin-right: 6px; vertical-align: middle; }

  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 28px; align-items: start; }
  .two-col-wide { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .spec-card { background: #fbf9f4; border: 1px solid #e4dfd4; border-radius: 12px; padding: 18px; }

  ol.steps, ul.bullets { margin: 8px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.65; color: rgba(30,22,15,0.85); }
  ol.steps li, ul.bullets li { margin-bottom: 5px; }
  ol.steps code, ul.bullets code, .spec-card code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; background: rgba(30,22,15,0.06); padding: 1px 5px; border-radius: 3px; }

  .footer { padding: 24px 48px 48px; max-width: 1440px; margin: 0 auto; font-size: 11px; color: rgba(30,22,15,0.45); font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e4dfd4; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-hybrid.jsx"></script>
<script type="text/babel" src="profile.jsx"></script>
<script type="text/babel" src="nav-bubble-full.jsx"></script>

<script type="text/babel">
// ─── Small context backdrop for the nav frames ───
function MockWorkspace({ panes = ['reader', 'dict'] }) {
  const accents = { reader: '#D97757', dict: '#4B7AA3', decks: '#8FB08A', study: '#C78A4F', library: '#B5A27C' };
  const labels  = { reader: 'Reader', dict: 'Dictionary', decks: 'Decks', study: 'Study', library: 'Library' };
  return (
    <div className="theme-default" style={{ width: '100%', height: '100%', background: 'var(--bg)', display: 'flex', position: 'relative', overflow: 'hidden' }}>
      {panes.map((p, i) => (
        <div key={p} style={{
          flex: p === 'reader' ? 2 : 1, borderRight: i < panes.length - 1 ? '1px solid var(--border)' : 'none',
          padding: '18px 22px', color: 'var(--fg-muted)', fontSize: 12, lineHeight: 1.7,
          background: `linear-gradient(180deg, color-mix(in oklab, ${accents[p]} 5%, var(--bg)) 0%, var(--bg) 40%)`,
          position: 'relative', overflow: 'hidden',
        }}>
          <div style={{ fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: accents[p], fontWeight: 700 }}>{labels[p]}</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 20, color: 'var(--fg)', marginTop: 6, marginBottom: 14 }}>
            {p === 'reader' ? 'こゝろ · 夏目 漱石' : p === 'dict' ? '「鎌倉」' : labels[p]}
          </div>
          <div style={{ height: 8, background: 'var(--bg-sunken)', borderRadius: 4, marginBottom: 10, width: '70%' }}/>
          <div style={{ height: 8, background: 'var(--bg-sunken)', borderRadius: 4, marginBottom: 10, width: '88%' }}/>
          <div style={{ height: 8, background: 'var(--bg-sunken)', borderRadius: 4, marginBottom: 10, width: '60%' }}/>
          <div style={{ height: 8, background: 'var(--bg-sunken)', borderRadius: 4, marginBottom: 10, width: '78%' }}/>
          <div style={{ height: 8, background: 'var(--bg-sunken)', borderRadius: 4, marginBottom: 10, width: '52%' }}/>
        </div>
      ))}
    </div>
  );
}

function EmptyWorkspace() {
  return (
    <div className="theme-default" style={{ width: '100%', height: '100%', background: 'var(--bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--fg-subtle)', fontSize: 12, letterSpacing: '0.14em', textTransform: 'uppercase', fontFamily: 'var(--font-ui)' }}>
      no panes open
    </div>
  );
}

// Frame wraps a nav state with a caption above
function NavFrame({ label, height = 280, children, annos = [] }) {
  return (
    <div>
      <div className="cap" style={{ marginBottom: 8 }}>{label}</div>
      <div className="frame" style={{ height }}>
        {children}
        {annos.map((a, i) => (
          <div key={i} className={`anno ${a.pos || 'top'}`} style={{
            left: a.left, right: a.right, top: a.top, bottom: a.bottom,
            transform: a.cx ? 'translateX(-50%)' : undefined,
          }}>
            {a.text}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      {/* ─────────── COVER ─────────── */}
      <div className="cover">
        <div>
          <div className="cover-meta">HANDOFF · 01 · NAV & PROFILE · v1.0 · APR 2026</div>
          <h1 className="cover-title">Bottom nav<br/>& Profile bubble.</h1>
          <h2 className="cover-subtitle">A horizontal workspace dock and its companion floating profile pane.</h2>
          <div className="legend-row">
            <span><span className="legend-dot" style={{ background: '#D97757' }}/>Reader</span>
            <span><span className="legend-dot" style={{ background: '#4B7AA3' }}/>Dictionary</span>
            <span><span className="legend-dot" style={{ background: '#8FB08A' }}/>Decks</span>
            <span><span className="legend-dot" style={{ background: '#C78A4F' }}/>Study</span>
            <span><span className="legend-dot" style={{ background: '#B5A27C' }}/>Library</span>
          </div>
        </div>
        <div className="cover-toc">
          <div className="cap">Contents</div>
          <div className="cover-toc-row"><span className="n">01</span><span className="t">Navigation — anatomy & states</span><span className="p">p.02</span></div>
          <div className="cover-toc-row"><span className="n">02</span><span className="t">Navigation — interaction spec</span><span className="p">p.03</span></div>
          <div className="cover-toc-row"><span className="n">03</span><span className="t">Profile bubble — anatomy</span><span className="p">p.04</span></div>
          <div className="cover-toc-row"><span className="n">04</span><span className="t">Profile bubble — behaviors</span><span className="p">p.05</span></div>
          <div className="cover-toc-row"><span className="n">05</span><span className="t">Tokens & measurements</span><span className="p">p.06</span></div>
        </div>
      </div>

      <div className="divider"/>

      {/* ─────────── 01 NAV ANATOMY ─────────── */}
      <div className="section-head">
        <h1 className="eyebrow">01 · Navigation</h1>
        <h3 className="sec">Anatomy & states</h3>
        <p className="sec-sub">One horizontal bar, center-bottom. Two clusters separated by a vertical divider: draggable <b>workspace</b> items on the left (Library · Reader · Dictionary · Decks · Study) and compact <b>non-workspace</b> items on the right (Home · Profile · Settings). Each workspace button is both the toggle and the draggable chip — the two concepts are merged.</p>
      </div>

      <div className="section-body" style={{ marginTop: 28 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
          <NavFrame label="State A · Resting — 2 panes open"
            annos={[
              { text: 'open = accent dot under icon', left: '38%', bottom: 92, pos: 'bottom' },
              { text: 'divider separates clusters', right: 210, bottom: 52, pos: 'bottom' },
            ]}>
            <MockWorkspace panes={['reader', 'dict']}/>
            <HybridNav open={['reader', 'dict']} hoverBar={false} activeTab={null}/>
          </NavFrame>

          <NavFrame label="State B · Bar-hover — every ws button expands"
            annos={[
              { text: 'drag handle appears', left: '22%', top: 180, pos: 'top' },
              { text: 'active chip shows dot + order pip', left: '48%', bottom: 88, pos: 'bottom' },
            ]}>
            <MockWorkspace panes={['reader', 'dict']}/>
            <HybridNav open={['reader', 'dict']} hoverBar={true} activeTab={null}/>
          </NavFrame>

          <NavFrame label="State C · Dragging a chip"
            annos={[
              { text: 'ghost: dashed outline in item accent', left: '40%', bottom: 92, pos: 'bottom' },
            ]}>
            <MockWorkspace panes={['reader', 'dict']}/>
            <HybridNav open={['reader', 'dict']} hoverBar={true} dragKey="dict" activeTab={null}/>
          </NavFrame>

          <NavFrame label="State D · Empty — no panes open"
            annos={[
              { text: 'no dots, all ws buttons compact', left: '40%', bottom: 92, pos: 'bottom' },
            ]}>
            <EmptyWorkspace/>
            <HybridNav open={[]} hoverBar={false} activeTab={null}/>
          </NavFrame>
        </div>
      </div>

      <div className="divider"/>

      {/* ─────────── 02 INTERACTION SPEC ─────────── */}
      <div className="section-head">
        <h1 className="eyebrow">02 · Navigation</h1>
        <h3 className="sec">Interaction spec</h3>
        <p className="sec-sub">Merged toggle + drag. Non-workspace items are a separate class — they open bubbles, never chips.</p>
      </div>
      <div className="section-body" style={{ marginTop: 24 }}>
        <div className="two-col">
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 10 }}>Workspace buttons</div>
            <table className="spec">
              <tbody>
                <tr><td className="k">click (idle or active)</td><td className="v">toggle pane open / closed</td></tr>
                <tr><td className="k">press + drag</td><td className="v">reorder within open panes. Drag from closed → drops it opened at that slot.</td></tr>
                <tr><td className="k">hover bar (anywhere)</td><td className="v">expand <b>all</b> ws buttons → icon + label + drag handle + order pip</td></tr>
                <tr><td className="k">open indicator</td><td className="v">item-colored dot under icon, 5×5 px</td></tr>
                <tr><td className="k">ordering</td><td className="v">open items render first (in order), closed items after</td></tr>
              </tbody>
            </table>
          </div>
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 10 }}>Non-workspace buttons</div>
            <table className="spec">
              <tbody>
                <tr><td className="k">click</td><td className="v">toggle that item's bubble</td></tr>
                <tr><td className="k">expand on hover</td><td className="v">no — stays compact</td></tr>
                <tr><td className="k">drag</td><td className="v">disabled</td></tr>
                <tr><td className="k">active indicator</td><td className="v">filled <code>bg-sunken</code>, fg color</td></tr>
                <tr><td className="k">members</td><td className="v">Home · Profile · Settings</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div style={{ marginTop: 24 }} className="two-col-wide">
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 8 }}>Keyboard</div>
            <table className="spec">
              <tbody>
                <tr><td className="k">⌘ / Ctrl + 1..5</td><td className="v">toggle ws panes in order</td></tr>
                <tr><td className="k">⌘ + Shift + ←/→</td><td className="v">reorder focused ws pane</td></tr>
                <tr><td className="k">Esc</td><td className="v">close active bubble</td></tr>
              </tbody>
            </table>
          </div>
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 8 }}>Motion</div>
            <table className="spec">
              <tbody>
                <tr><td className="k">expand / collapse</td><td className="v">160ms ease-out · padding + gap + border-radius</td></tr>
                <tr><td className="k">drag lift</td><td className="v">120ms · opacity 1→0.4, scale 1→1.02</td></tr>
                <tr><td className="k">reorder neighbors</td><td className="v">180ms spring · translate only</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div className="divider"/>

      {/* ─────────── 03 PROFILE BUBBLE ANATOMY ─────────── */}
      <div className="section-head">
        <h1 className="eyebrow">03 · Profile bubble</h1>
        <h3 className="sec">Full-profile window, not a shortcut</h3>
        <p className="sec-sub">880 × 620 floating pane anchored to the Profile button. The whole profile page is inside — cover, avatar, identity, stats, currently reading, shared decks, and preferences — but it's ephemeral: tap anywhere outside to dismiss.</p>
      </div>
      <div className="section-body" style={{ marginTop: 28 }}>
        <div className="frame" style={{ height: 780 }}>
          <span className="label-pill">Profile · open over workspace</span>
          <MockWorkspace panes={['reader', 'dict']}/>
          <div style={{ position: 'absolute', inset: 0, zIndex: 35, background: 'rgba(20,16,12,0.06)', backdropFilter: 'blur(2px)', WebkitBackdropFilter: 'blur(2px)' }}/>
          <FullProfileBubble/>
          <HybridNav open={['reader', 'dict']} hoverBar={false} activeTab="profile"/>

          {/* Annotations */}
          <div className="anno bottom" style={{ left: '50%', transform: 'translateX(calc(-50% + 240px))', top: 76 }}>cover band — editable</div>
          <div className="anno right" style={{ left: 240, top: 170 }}>kamon avatar · 88px · editable</div>
          <div className="anno left" style={{ right: 140, top: 170 }}>identity · level · streak · words</div>
          <div className="anno bottom" style={{ left: '50%', transform: 'translateX(-50%)', top: 330 }}>2-col body · scrolls internally</div>
          <div className="anno top" style={{ left: '50%', transform: 'translateX(calc(-50% + 102px))', bottom: 108 }}>anchored to Profile btn</div>
        </div>
      </div>

      <div className="divider"/>

      {/* ─────────── 04 PROFILE BEHAVIORS ─────────── */}
      <div className="section-head">
        <h1 className="eyebrow">04 · Profile bubble</h1>
        <h3 className="sec">Open, dismiss, persist</h3>
      </div>
      <div className="section-body" style={{ marginTop: 24 }}>
        <div className="two-col-wide">
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 8 }}>Open / close</div>
            <ol className="steps">
              <li>Tap Profile in the nav → bubble fades + scales in from the button origin (≈180 ms)</li>
              <li>Profile button takes active state (filled <code>fg</code> / <code>bg-elev</code>)</li>
              <li>Soft scrim layers over workspace: <code>rgba(20,16,12,0.06)</code> + 2px blur</li>
              <li>Tap anywhere outside → closes</li>
              <li>Tap Profile again → closes</li>
              <li><code>Esc</code> → closes</li>
            </ol>
          </div>
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 8 }}>Content structure</div>
            <table className="spec">
              <tbody>
                <tr><td className="k">cover band</td><td className="v">108 h · editable gradient</td></tr>
                <tr><td className="k">identity row</td><td className="v">kamon 88 · name · chips</td></tr>
                <tr><td className="k">left column</td><td className="v">Account form · Shared decks</td></tr>
                <tr><td className="k">right column</td><td className="v">At-a-glance · Currently reading · Actions</td></tr>
                <tr><td className="k">trimmed</td><td className="v">full kamon picker modal · settings subpanes · deep deck mgmt</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div style={{ marginTop: 24 }} className="spec-card">
          <div className="cap" style={{ marginBottom: 8 }}>Stacking with workspace</div>
          <ul className="bullets">
            <li>Workspace panes remain visible underneath — this is not a modal takeover</li>
            <li>The bar itself stays <b>on top</b> of the bubble (<code>z-index 45 &gt; 40</code>) so the anchor is always clickable</li>
            <li>Bubble never fills the screen — <code>880 × 620</code>, positioned 82px above the bar</li>
            <li>The same container extends to Home and Settings — swap contents, keep the frame</li>
          </ul>
        </div>
      </div>

      <div className="divider"/>

      {/* ─────────── 05 TOKENS ─────────── */}
      <div className="section-head">
        <h1 className="eyebrow">05 · Tokens</h1>
        <h3 className="sec">Measurements & style</h3>
      </div>
      <div className="section-body" style={{ marginTop: 24 }}>
        <div className="two-col-wide">
          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 10 }}>Nav bar</div>
            <table className="spec">
              <tbody>
                <tr><th>key</th><th>value</th></tr>
                <tr><td className="k">container</td><td className="v">rgba(255,255,255,0.92) · blur 22px sat 170%</td></tr>
                <tr><td className="k">border</td><td className="v">1px var(--border)</td></tr>
                <tr><td className="k">radius</td><td className="v">16px</td></tr>
                <tr><td className="k">padding</td><td className="v">6px</td></tr>
                <tr><td className="k">shadow</td><td className="v">0 18px 48px rgba(0,0,0,0.15)</td></tr>
                <tr><td className="k">bottom offset</td><td className="v">18px from viewport bottom</td></tr>
                <tr><td className="k">button (resting)</td><td className="v">32 × 32 · radius 9 · icon 16</td></tr>
                <tr><td className="k">button (hover)</td><td className="v">radius 10 · 6px gap · label 11.5/500</td></tr>
                <tr><td className="k">active dot</td><td className="v">5×5 · item color · offset −7 under icon</td></tr>
                <tr><td className="k">divider</td><td className="v">1 × 26 · var(--border) · 4px margin</td></tr>
              </tbody>
            </table>
          </div>

          <div className="spec-card">
            <div className="cap" style={{ marginBottom: 10 }}>Profile bubble</div>
            <table className="spec">
              <tbody>
                <tr><th>key</th><th>value</th></tr>
                <tr><td className="k">size</td><td className="v">880 × 620</td></tr>
                <tr><td className="k">position</td><td className="v">bottom 82 · left 50% · translateX(−50%)</td></tr>
                <tr><td className="k">background</td><td className="v">var(--bg-elev)</td></tr>
                <tr><td className="k">border</td><td className="v">1px var(--border)</td></tr>
                <tr><td className="k">radius</td><td className="v">20px</td></tr>
                <tr><td className="k">shadow</td><td className="v">0 32px 80px rgba(0,0,0,0.22)</td></tr>
                <tr><td className="k">cover height</td><td className="v">108px</td></tr>
                <tr><td className="k">avatar</td><td className="v">88 · overlaps cover by 44</td></tr>
                <tr><td className="k">body padding</td><td className="v">18px 24px 22px</td></tr>
                <tr><td className="k">column split</td><td className="v">1.25fr : 1fr · 20px gap</td></tr>
                <tr><td className="k">scrim</td><td className="v">rgba(20,16,12,0.06) + blur 2px</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div style={{ marginTop: 24 }} className="spec-card">
          <div className="cap" style={{ marginBottom: 10 }}>Item colors (workspace dots)</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16 }}>
            {[
              { k: 'library', l: 'Library', c: '#B5A27C' },
              { k: 'reader', l: 'Reader', c: '#D97757' },
              { k: 'dict', l: 'Dictionary', c: '#4B7AA3' },
              { k: 'decks', l: 'Decks', c: '#8FB08A' },
              { k: 'study', l: 'Study', c: '#C78A4F' },
            ].map(x => (
              <div key={x.k} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', background: 'white', border: '1px solid #e4dfd4', borderRadius: 8 }}>
                <div style={{ width: 18, height: 18, borderRadius: 99, background: x.c }}/>
                <div style={{ fontFamily: 'JetBrains Mono, ui-monospace, monospace', fontSize: 12 }}>
                  <div style={{ fontWeight: 600 }}>{x.l}</div>
                  <div style={{ color: 'rgba(30,22,15,0.5)', fontSize: 10.5 }}>{x.c}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="footer">
        <span>Langeco · Design System · Nav & Profile</span>
        <span>v1.0 · Apr 2026</span>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
