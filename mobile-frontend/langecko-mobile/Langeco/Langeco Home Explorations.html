<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Home Explorations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-hybrid.jsx"></script>
<script type="text/babel" src="home-explorations.jsx"></script>

<script type="text/babel">
function AB({ width, height, children, label }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden', position: 'relative' }}>
        {children}
        {/* overlay the new hybrid nav, Home active in non-ws cluster */}
        <HybridNav open={[]} hoverBar={false} activeTab="home"/>
      </div>
    </DCArtboard>
  );
}

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Home · three directions</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.72)', maxWidth: 860, lineHeight: 1.55 }}>
          Library is no longer a workspace pane — it lives inside Home, alongside section shortcuts for Decks and Dictionary.
          Clicking a book opens the Reader; clicking a deck or dictionary entry opens their full pages. The new hybrid nav floats
          at the bottom; Home is the left item of the non-workspace cluster and is shown active here.
        </div>
      </div>

      <DCSection title="H1 · Atelier" subtitle="Editorial column. Hero continue-reading card up top, then three horizontally-scrolling rows — Library, Decks, Dictionary. Calm, reading-first rhythm; feels like opening a book.">
        <AB width={1220} height={900} label="H1  atelier"><HomeAtelier/></AB>
      </DCSection>

      <DCSection title="H2 · Tri-column board" subtitle="Three parallel columns — Library, Decks, Dictionary — each a compact list. One glance tells you what's in all three domains. Continue-reading sits as a wide strip above the columns.">
        <AB width={1220} height={900} label="H2  tri-column"><HomeTriColumn/></AB>
      </DCSection>

      <DCSection title="H3 · Bento" subtitle="Asymmetric dashboard grid. Big hero continue-reading tile with cover-color background, flanked by Due decks and Recent lookups tiles, then a wide library row. Modern one-screen home.">
        <AB width={1220} height={900} label="H3  bento"><HomeBento/></AB>
      </DCSection>

      <DCSection title="Notes" subtitle="Applies to all three.">
        <div style={{ padding: '0 60px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, maxWidth: 1200, fontSize: 13, lineHeight: 1.7, color: 'rgba(60,50,40,0.82)' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Navigation consequences</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>Library removed from the draggable workspace cluster</li>
              <li>Home button in non-ws cluster now opens this page</li>
              <li>Workspace items are now: Reader · Dictionary · Decks · Study</li>
              <li>Book click → opens Reader (as a pane)</li>
              <li>Deck / dict item → opens their full page (replaces Home view)</li>
            </ul>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Pick by feel</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li><b>Atelier</b> — if reading should dominate; browsing happens by scrolling rows</li>
              <li><b>Tri-column</b> — if the user treats decks & dictionary as co-equal with books</li>
              <li><b>Bento</b> — if "one glance, all signals" matters most; most opinionated, most visual</li>
            </ul>
          </div>
        </div>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
