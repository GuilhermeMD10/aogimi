<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Full canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="reader.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="dictionary.jsx"></script>
<script type="text/babel" src="decks.jsx"></script>
<script type="text/babel" src="study.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="profile.jsx"></script>
<script type="text/babel" src="modular.jsx"></script>

<script type="text/babel">
function Artboard({ width, height, children, label, note }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden', position: 'relative' }}>
        {children}
        {note && (
          <div style={{ position: 'absolute', top: 8, right: 8, background: 'rgba(0,0,0,0.72)', color: 'white', fontSize: 10, padding: '3px 7px', borderRadius: 4, fontFamily: 'ui-monospace, monospace', zIndex: 100 }}>{note}</div>
        )}
      </div>
    </DCArtboard>
  );
}

function PaletteCard({ title, subtitle, swatches, preview, fonts, themeClass, premium }) {
  return (
    <DCArtboard width={420} height={260} label={`${title}${premium ? ' · premium' : ''}`}>
      <div className={themeClass} style={{ width: '100%', height: '100%', padding: 18, display: 'flex', flexDirection: 'column', position: 'relative' }}>
        {premium && (
          <div style={{ position: 'absolute', top: 10, right: 10, fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 700, padding: '3px 7px', borderRadius: 99, background: 'var(--accent)', color: 'var(--bg)' }}>Premium</div>
        )}
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 28, lineHeight: 1, letterSpacing: '-0.02em', marginBottom: 2, color: 'var(--fg)' }}>{title}</div>
        <div style={{ fontSize: 12, color: 'var(--fg-muted)', marginBottom: 14 }}>{subtitle}</div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {swatches.map(s => (
            <div key={s.n} style={{ flex: 1, height: 40, background: s.c, borderRadius: 4, border: '1px solid rgba(0,0,0,0.06)' }}/>
          ))}
        </div>
        <div style={{ fontFamily: 'var(--font-reader)', fontSize: 16, color: 'var(--fg)', borderTop: '1px solid var(--border)', paddingTop: 10 }}>{preview}</div>
        <div style={{ fontSize: 10, color: 'var(--fg-muted)', marginTop: 2, fontFamily: 'Inter, sans-serif' }}>{fonts}</div>
      </div>
    </DCArtboard>
  );
}

function SideBySide({ label, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div style={{ fontSize: 11, color: 'rgba(60,50,40,0.65)', letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 600, paddingLeft: 4 }}>{label}</div>
      <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>{children}</div>
    </div>
  );
}

function App() {
  const W = 1180, H = 760;
  const RW = 960, RH = 680;
  const DW = 1180, DH = 780;        // dictionary / decks
  const SW = 1020, SH = 720;        // study
  const AW = 1180, AH = 760;        // auth
  const PW = 1180, PH = 820;        // profile
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Langeco · 語境</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.7)', maxWidth: 760, lineHeight: 1.55 }}>
          Default (free) vs. Kanagawa (premium) across every surface. Existing frames kept on top
          — new pages (Dictionary, Decks, Study, Auth, Profile) added below.
        </div>
      </div>

      {/* ───────── Existing: themes + library + reader + modular ───────── */}

      <DCSection title="00 · Themes" subtitle="One default (free, neutral) + three premium cultural themes. Tokens saved; premium themes swap palette + type only.">
        <PaletteCard
          themeClass="theme-default"
          title="Default"
          subtitle="Free — neutral, minimal"
          swatches={[
            {n:'ink', c:'#1A1918'},{n:'graphite', c:'#6B6966'},{n:'stone', c:'#A8A5A0'},
            {n:'tint', c:'#D4D2CE'},{n:'sunken', c:'#F2F1EE'},{n:'paper', c:'#FAFAF9'},
          ]}
          preview="Clean type, quiet chrome."
          fonts="Inter · Source Serif 4"
        />
        <PaletteCard
          themeClass="theme-kanagawa kanagawa-texture"
          title="神奈川沖浪裏"
          subtitle="The Great Wave off Kanagawa"
          swatches={[
            {n:'ink', c:'#0F2340'},{n:'indigo', c:'#1E3D6B'},{n:'wave', c:'#4B7AA3'},
            {n:'foam', c:'#F1EEE0'},{n:'sand', c:'#D4C999'},{n:'paper', c:'#EDE6D3'},
          ]}
          preview="波の下にも都の候ぞ"
          fonts="Shippori Mincho · Noto Sans JP"
          premium
        />
        <PaletteCard
          themeClass="theme-sakura sakura-texture"
          title="桜花爛漫"
          subtitle="Cherry blossoms in full bloom"
          swatches={[
            {n:'bark', c:'#3E2A2F'},{n:'blossom', c:'#D47A8C'},{n:'petal', c:'#F7DCE0'},
            {n:'leaf', c:'#8FB08A'},{n:'sky', c:'#9BB8D6'},{n:'trunk', c:'#8B5E4A'},
          ]}
          preview="花の雲 鐘は上野か浅草か"
          fonts="Klee One · Shippori Mincho"
          premium
        />
        <PaletteCard
          themeClass="theme-hanami hanami-texture"
          title="花見の夜"
          subtitle="Hanami festival — lantern night"
          swatches={[
            {n:'lacquer', c:'#14100C'},{n:'torii', c:'#E04B2A'},{n:'saffron', c:'#F2B33D'},
            {n:'gold', c:'#D98830'},{n:'paper', c:'#F5E9D4'},{n:'smoke', c:'#B0987A'},
          ]}
          preview="灯りの下 春の夜"
          fonts="Shippori Mincho · Inter"
          premium
        />
      </DCSection>

      <DCSection title="01 · Library — Default vs. Kanagawa" subtitle="Same layout, themed tokens only. No top tab bar here. Stats area reserved.">
        <Artboard width={W} height={H} label="01.a  Default"><Shell theme="default"/></Artboard>
        <Artboard width={W} height={H} label="01.b  Kanagawa"><Shell theme="kanagawa"/></Artboard>
      </DCSection>

      <DCSection title="02 · Reader — Default vs. Kanagawa" subtitle="Bottom floating toolbar · expand for type / layout / 横 vs 縦. RTL vertical mode respects Japanese convention.">
        <SideBySide label="Horizontal · toolbar expanded">
          <Artboard width={RW} height={RH} label="02.a  Default"><Reader theme="default" toolbarExpanded/></Artboard>
          <Artboard width={RW} height={RH} label="02.b  Kanagawa"><Reader theme="kanagawa" toolbarExpanded/></Artboard>
        </SideBySide>
        <SideBySide label="Horizontal · selection context menu">
          <Artboard width={RW} height={RH} label="02.c  Default"><Reader theme="default" showContextMenu/></Artboard>
          <Artboard width={RW} height={RH} label="02.d  Kanagawa"><Reader theme="kanagawa" showContextMenu/></Artboard>
        </SideBySide>
        <SideBySide label="Vertical RTL (縦) · Japanese convention">
          <Artboard width={RW} height={RH} label="02.e  Default" note="縦"><Reader theme="default" vertical/></Artboard>
          <Artboard width={RW} height={RH} label="02.f  Kanagawa" note="縦"><Reader theme="kanagawa" vertical/></Artboard>
        </SideBySide>
      </DCSection>

      <DCSection title="03 · Modular view — Default vs. Kanagawa" subtitle="Pane bar (top): each chip is a LIVE pane handle. Numbered, color-dotted, with a green 'live' indicator. Drag a chip past a neighbor (⇄) to swap panes.">
        <Artboard width={W + 240} height={H} label="03.a  Default · resting state"><ModularView theme="default"/></Artboard>
        <Artboard width={W + 240} height={H} label="03.b  Kanagawa · resting state"><ModularView theme="kanagawa"/></Artboard>
        <Artboard width={W + 240} height={H} label="03.c  Default · dragging chip #2 (Dictionary)" note="drag preview"><ModularView theme="default" draggingIdx={1}/></Artboard>
        <Artboard width={W + 240} height={H} label="03.d  Kanagawa · dragging chip #2 (Dictionary)" note="drag preview"><ModularView theme="kanagawa" draggingIdx={1}/></Artboard>
      </DCSection>

      {/* ───────── New: dictionary ───────── */}

      <DCSection title="04 · Full-screen Dictionary" subtitle="Search results list (never assumes a single match) + detailed entry view. Sidebar holds filters, recents, saved.">
        <SideBySide label="Results list · 5 matches for 「鎌倉」">
          <Artboard width={DW} height={DH} label="04.a  Default"><DictionarySearch theme="default"/></Artboard>
          <Artboard width={DW} height={DH} label="04.b  Kanagawa"><DictionarySearch theme="kanagawa"/></Artboard>
        </SideBySide>
        <SideBySide label="Detail entry · kanji breakdown, meanings, context, related">
          <Artboard width={DW} height={DH} label="04.c  Default"><DictionaryDetail theme="default"/></Artboard>
          <Artboard width={DW} height={DH} label="04.d  Kanagawa"><DictionaryDetail theme="kanagawa"/></Artboard>
        </SideBySide>
      </DCSection>

      {/* ───────── New: decks overview — 2 variations ───────── */}

      <DCSection title="05 · Decks overview" subtitle="Visual grid — cover + name + card count. (Option B / hero+list dropped; carrying A forward.)">
        <SideBySide label="Visual grid (locked direction)">
          <Artboard width={DW} height={DH} label="05.a  Default"><DecksOverviewA theme="default"/></Artboard>
          <Artboard width={DW} height={DH} label="05.b  Kanagawa"><DecksOverviewA theme="kanagawa"/></Artboard>
        </SideBySide>
      </DCSection>

      {/* ───────── New: deck detail + edit modal ───────── */}

      <DCSection title="06 · Deck detail — grid of mini cards" subtitle="Browse cards inside a deck. Each tile shows JP · reading · meaning · learning state. Click to edit in modal.">
        <SideBySide label="Resting state">
          <Artboard width={DW} height={DH} label="06.a  Default"><DeckDetail theme="default"/></Artboard>
          <Artboard width={DW} height={DH} label="06.b  Kanagawa"><DeckDetail theme="kanagawa"/></Artboard>
        </SideBySide>
        <SideBySide label="Edit card modal open">
          <Artboard width={DW} height={DH} label="06.c  Default" note="modal"><DeckDetail theme="default" showEditModal/></Artboard>
          <Artboard width={DW} height={DH} label="06.d  Kanagawa" note="modal"><DeckDetail theme="kanagawa" showEditModal/></Artboard>
        </SideBySide>
      </DCSection>

      {/* ───────── New: study ───────── */}

      <DCSection title="07 · Study session" subtitle="Know it / Don't know it — friendly, no SRS yet. Progress bar · context from book · summary screen on finish.">
        <SideBySide label="Card front (question)">
          <Artboard width={SW} height={SH} label="07.a  Default"><StudyFront theme="default"/></Artboard>
          <Artboard width={SW} height={SH} label="07.b  Kanagawa"><StudyFront theme="kanagawa"/></Artboard>
        </SideBySide>
        <SideBySide label="Card back (answer + rate)">
          <Artboard width={SW} height={SH} label="07.c  Default"><StudyBack theme="default"/></Artboard>
          <Artboard width={SW} height={SH} label="07.d  Kanagawa"><StudyBack theme="kanagawa"/></Artboard>
        </SideBySide>
        <SideBySide label="Session summary">
          <Artboard width={SW} height={SH} label="07.e  Default"><StudySummary theme="default"/></Artboard>
          <Artboard width={SW} height={SH} label="07.f  Kanagawa"><StudySummary theme="kanagawa"/></Artboard>
        </SideBySide>
      </DCSection>

      {/* ───────── New: auth ───────── */}

      <DCSection title="08 · Auth — login + signup" subtitle="Split layout: form on left, themed brand panel with central kamon on right.">
        <SideBySide label="Sign in">
          <Artboard width={AW} height={AH} label="08.a  Default"><LoginPage theme="default"/></Artboard>
          <Artboard width={AW} height={AH} label="08.b  Kanagawa"><LoginPage theme="kanagawa"/></Artboard>
        </SideBySide>
        <SideBySide label="Create account">
          <Artboard width={AW} height={AH} label="08.c  Default"><SignupPage theme="default"/></Artboard>
          <Artboard width={AW} height={AH} label="08.d  Kanagawa"><SignupPage theme="kanagawa"/></Artboard>
        </SideBySide>
      </DCSection>

      {/* ───────── New: modular multi-pane workspace ───────── */}

      <DCSection title="10 · Modular workspace — Reader + Dictionary + Decks together" subtitle="Collapsible left nav · live panes in the pane bar · different stages of use. All existing panels kept — these show how they fit side-by-side.">
        <SideBySide label="A · Reader + Dictionary (empty, waiting for a tap)">
          <Artboard width={1320} height={780} label="10.a  Default"><ModularWorkspace theme="default" panes={['reader', 'dict']} dictState="empty" scenarioLabel="reader open · dictionary waiting for selection"/></Artboard>
          <Artboard width={1320} height={780} label="10.b  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'dict']} dictState="empty"/></Artboard>
        </SideBySide>
        <SideBySide label="B · Reader + Dictionary (word tapped → detail)">
          <Artboard width={1320} height={780} label="10.c  Default"><ModularWorkspace theme="default" panes={['reader', 'dict']} dictState="detail" scenarioLabel="tapped 鎌倉 in the reader · dictionary shows full entry"/></Artboard>
          <Artboard width={1320} height={780} label="10.d  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'dict']} dictState="detail"/></Artboard>
        </SideBySide>
        <SideBySide label="C · Reader + Dictionary search results (typed query, list of matches)">
          <Artboard width={1320} height={780} label="10.e  Default"><ModularWorkspace theme="default" panes={['reader', 'dict']} dictState="results" scenarioLabel="typed 鎌倉 in dict · 4 results, first selected"/></Artboard>
          <Artboard width={1320} height={780} label="10.f  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'dict']} dictState="results"/></Artboard>
        </SideBySide>
        <SideBySide label="D · Reader + Decks list (browsing decks alongside book)">
          <Artboard width={1320} height={780} label="10.g  Default"><ModularWorkspace theme="default" panes={['reader', 'decks']} decksState="list" scenarioLabel="reading · decks side-pane showing 4 decks"/></Artboard>
          <Artboard width={1320} height={780} label="10.h  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'decks']} decksState="list"/></Artboard>
        </SideBySide>
        <SideBySide label="E · Reader + Deck card grid (inside a specific deck)">
          <Artboard width={1320} height={780} label="10.i  Default"><ModularWorkspace theme="default" panes={['reader', 'decks']} decksState="cards" scenarioLabel="drilled into Kokoro — Ch. 1 · card grid next to the passage it came from"/></Artboard>
          <Artboard width={1320} height={780} label="10.j  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'decks']} decksState="cards"/></Artboard>
        </SideBySide>
        <SideBySide label="F · Reader + Study in progress (flashcard session live in side pane)">
          <Artboard width={1320} height={780} label="10.k  Default"><ModularWorkspace theme="default" panes={['reader', 'decks']} decksState="study" scenarioLabel="studying Kokoro deck while reading · progress 3/12"/></Artboard>
          <Artboard width={1320} height={780} label="10.l  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'decks']} decksState="study"/></Artboard>
        </SideBySide>
        <SideBySide label="G · Three panes — Reader + Dictionary + Decks together (power-user)">
          <Artboard width={1560} height={800} label="10.m  Default"><ModularWorkspace theme="default" panes={['reader', 'dict', 'decks']} dictState="detail" decksState="cards" scenarioLabel="full workspace · three live panes"/></Artboard>
          <Artboard width={1560} height={800} label="10.n  Kanagawa"><ModularWorkspace theme="kanagawa" panes={['reader', 'dict', 'decks']} dictState="detail" decksState="cards"/></Artboard>
        </SideBySide>
        <SideBySide label="H · Navbar expanded (on hover / pinned)">
          <Artboard width={1320} height={780} label="10.o  Default · nav expanded"><ModularWorkspace theme="default" navCollapsed={false} panes={['reader', 'dict']} dictState="detail" scenarioLabel="nav expanded · labels visible"/></Artboard>
          <Artboard width={1320} height={780} label="10.p  Kanagawa · nav expanded"><ModularWorkspace theme="kanagawa" navCollapsed={false} panes={['reader', 'dict']} dictState="detail"/></Artboard>
        </SideBySide>
        <DCPostIt top={260} right={60} rotate={-3} width={260}>
          Every scenario reuses the <b>same</b> Reader, Dictionary, and Decks panels — just composed differently. No extra chrome; the left nav collapses to an icon rail by default.
        </DCPostIt>
      </DCSection>

      {/* ───────── New: profile ───────── */}

      <DCSection title="09 · Profile — editable own profile" subtitle="Avatar (kamon monogram) · level · streak · account · shared decks · currently reading. Social-ready but single-user for now.">
        <SideBySide label="Profile overview">
          <Artboard width={PW} height={PH} label="09.a  Default"><ProfilePage theme="default"/></Artboard>
          <Artboard width={PW} height={PH} label="09.b  Kanagawa"><ProfilePage theme="kanagawa"/></Artboard>
        </SideBySide>
        <SideBySide label="Avatar picker · 16 kamon monograms (demo)">
          <Artboard width={PW} height={PH} label="09.c  Default" note="picker"><ProfilePage theme="default" showAvatarPicker/></Artboard>
          <Artboard width={PW} height={PH} label="09.d  Kanagawa" note="picker"><ProfilePage theme="kanagawa" showAvatarPicker/></Artboard>
        </SideBySide>
        <DCPostIt top={240} right={60} rotate={3} width={260}>
          Kamon avatars are <b>demo-only</b>. When social lands we'll swap in real uploads; the 16 monograms are just safe placeholders.
        </DCPostIt>
      </DCSection>

      <DCPostIt top={80} right={80} rotate={3} width={240}>
        Tab bar → <b>pane bar</b>: chips are handles, not tabs. All three panes live simultaneously — ⇄ arrows and the live-dot make that legible.
      </DCPostIt>

      <div style={{ padding: '20px 60px 60px', fontSize: 12, color: 'rgba(60,50,40,0.55)', maxWidth: 760 }}>
        Next — pick a Decks variation (A vs. B), decide on real avatar uploads vs. kamon-only for launch, and I'll wire real drag interaction in Modular view plus the EPUB import flow.
      </div>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
