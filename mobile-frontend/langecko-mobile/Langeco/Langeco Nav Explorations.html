<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Nav Explorations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-explorations.jsx"></script>

<script type="text/babel">
function AB({ width, height, children, label }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden' }}>{children}</div>
    </DCArtboard>
  );
}
function Row({ label, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div style={{ fontSize: 11, color: 'rgba(60,50,40,0.65)', letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 600, paddingLeft: 4 }}>{label}</div>
      <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', flexWrap: 'wrap' }}>{children}</div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Navbar explorations</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.72)', maxWidth: 820, lineHeight: 1.55 }}>
          Three directions for a unified nav. All three make the app <b>modular-only</b>: clicking a nav icon toggles that
          pane in the workspace — there's no separate Reader or Dictionary route. Open panes are draggable chips (the current
          top pane-bar, absorbed). Each variant shows: resting state · hover/expanded · during drag · collapsed to a ball ·
          composed into a 2-pane workspace.
        </div>
      </div>

      {/* ══════════════════════════════════════════════════════════════════ */}
      <DCSection title="V1 · Dock rail" subtitle="Vertical rail left-side. Resting = 52px icons. Hover → 212px with labels. Open panes live at the top of the rail as draggable rows with color dot + drag grip; nav items below sit unopened. Collapse → 52px ball column.">
        <Row label="Component — resting / hover / dragging / ball">
          <AB width={80} height={520} label="resting"><div className="theme-default" style={{ display: 'flex', width: '100%', height: '100%' }}><NavDockRail open={['reader', 'dict']}/></div></AB>
          <AB width={236} height={520} label="hover expanded"><div className="theme-default" style={{ display: 'flex', width: '100%', height: '100%' }}><NavDockRail expanded open={['reader', 'dict']}/></div></AB>
          <AB width={236} height={520} label="dragging dict chip"><div className="theme-default" style={{ display: 'flex', width: '100%', height: '100%' }}><NavDockRail expanded open={['reader', 'dict', 'decks']} dragIdx={1}/></div></AB>
          <AB width={80} height={520} label="collapsed · ball"><div className="theme-default" style={{ display: 'flex', width: '100%', height: '100%' }}><NavDockRail asBall/></div></AB>
        </Row>
        <Row label="Workspace — 2 panes · rail hover-expanded">
          <AB width={1220} height={560} label="V1 · Reader + Dictionary"><WS_DockRail expanded/></AB>
        </Row>
      </DCSection>

      {/* ══════════════════════════════════════════════════════════════════ */}
      <DCSection title="V2 · Top bar" subtitle="One horizontal bar. Left cluster: all nav icons (active = has colored dot underneath). Right cluster: open-pane chips, draggable with ⋮⋮ grip and ⇄ reorder affordances. Hover grows bar height and reveals labels inline. Collapse → single logo ball docked top-right.">
        <Row label="Component — resting / hover / dragging / ball">
          <AB width={1100} height={80} label="resting"><div className="theme-default" style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100%' }}><NavTopBar open={['reader', 'dict']}/></div></AB>
          <AB width={1100} height={80} label="hover expanded"><div className="theme-default" style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100%' }}><NavTopBar hover open={['reader', 'dict', 'decks']}/></div></AB>
          <AB width={1100} height={80} label="dragging Dictionary chip"><div className="theme-default" style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100%' }}><NavTopBar open={['reader', 'dict', 'decks']} dragIdx={1}/></div></AB>
          <AB width={1100} height={80} label="collapsed · ball"><div className="theme-default" style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100%' }}><NavTopBar asBall/></div></AB>
        </Row>
        <Row label="Workspace — 2 panes · bar hover-expanded">
          <AB width={1220} height={560} label="V2 · Reader + Dictionary"><WS_TopBar hover/></AB>
        </Row>
      </DCSection>

      {/* ══════════════════════════════════════════════════════════════════ */}
      <DCSection title="V3 · Floating pill" subtitle="Free-floating glass pill at bottom-center (command-bar / Control Center feel). Always on top of the workspace. Nav icons + open-pane chips in one horizontal capsule. Hover expands downward, revealing label caps under each section. Collapse → 52px ball in the bottom-right corner.">
        <Row label="Component — resting / hover / dragging">
          <AB width={780} height={110} label="resting"><div className="theme-default" style={{ position: 'relative', width: '100%', height: '100%', background: 'var(--bg)' }}><NavFloatingPill open={['reader', 'dict']}/></div></AB>
          <AB width={780} height={140} label="hover expanded"><div className="theme-default" style={{ position: 'relative', width: '100%', height: '100%', background: 'var(--bg)' }}><NavFloatingPill hover open={['reader', 'dict', 'decks']}/></div></AB>
          <AB width={780} height={110} label="dragging Dictionary chip"><div className="theme-default" style={{ position: 'relative', width: '100%', height: '100%', background: 'var(--bg)' }}><NavFloatingPill open={['reader', 'dict', 'decks']} dragIdx={1}/></div></AB>
          <AB width={200} height={110} label="collapsed · ball"><div className="theme-default" style={{ position: 'relative', width: '100%', height: '100%', background: 'var(--bg)' }}><NavFloatingPill asBall/></div></AB>
        </Row>
        <Row label="Workspace — 2 panes · pill at bottom-center">
          <AB width={1220} height={600} label="V3 · Reader + Dictionary"><WS_FloatingPill hover/></AB>
        </Row>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
