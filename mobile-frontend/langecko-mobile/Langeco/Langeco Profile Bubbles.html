<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Profile Bubble Explorations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-explorations.jsx"></script>
<script type="text/babel" src="nav-bubbles.jsx"></script>

<script type="text/babel">
function AB({ width, height, children, label }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden' }}>{children}</div>
    </DCArtboard>
  );
}

// Full frame: workspace backdrop + nav bar positioned + bubble overlay.
function Frame({ bubble, activeTab = 'profile' }) {
  return (
    <BubbleWS>
      {bubble}
      <div style={{ position: 'absolute', bottom: 18, left: '50%', transform: 'translateX(-50%)', zIndex: 45 }}>
        <NavInBubble openTab={activeTab}/>
      </div>
    </BubbleWS>
  );
}

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Profile · bubble directions</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.72)', maxWidth: 820, lineHeight: 1.55 }}>
          Profile (and other non-workspace items) as a floating bubble anchored to its navbar button — not a
          full-screen page. Tap outside anywhere to dismiss. Three directions, from tight to playful.
          Shown over the usual Reader + Dictionary workspace so you can judge scrim and fit.
        </div>
      </div>

      <DCSection title="V1 · Anchored popover" subtitle="Menu-sized card hovering above the Profile button with a small pointing tail. Tight list-style content. Smallest footprint — feels like a browser account menu.">
        <AB width={1220} height={560} label="V1  anchored popover"><Frame bubble={<V1_AnchoredPopover/>}/></AB>
        <div style={{ maxWidth: 520, fontSize: 13, lineHeight: 1.6, color: 'rgba(60,50,40,0.82)', padding: '0 8px' }}>
          <b>When to use</b> — quick glance at identity, stats, and a short menu.<br/>
          <b>Dimensions</b> — ~280×380, tail connects to the button.<br/>
          <b>Trade-off</b> — limited real estate; deeper tasks need "Open full profile".
        </div>
      </DCSection>

      <DCSection title="V2 · Rising sheet" subtitle="Wider panel (~520px) rising above the bar. Two columns: identity + stats on the left, quick-actions list on the right. Still not full-screen; still tap-outside to dismiss.">
        <AB width={1220} height={560} label="V2  rising sheet"><Frame bubble={<V2_RisingSheet/>}/></AB>
        <div style={{ maxWidth: 520, fontSize: 13, lineHeight: 1.6, color: 'rgba(60,50,40,0.82)', padding: '0 8px' }}>
          <b>When to use</b> — the profile bubble itself is enough for most flows; users rarely need a full page.<br/>
          <b>Dimensions</b> — ~520×360, horizontally split.<br/>
          <b>Trade-off</b> — bigger scrim footprint; feels less "ephemeral".
        </div>
      </DCSection>

      <DCSection title="V3 · Orbiting stack" subtitle="Identity pill rises directly; action bubbles fan up and stagger slightly to the right. Streak shows as a ring around the avatar. Most playful, lowest commitment — each row is a real standalone action card.">
        <AB width={1220} height={640} label="V3  orbiting stack"><Frame bubble={<V3_OrbitingStack/>}/></AB>
        <div style={{ maxWidth: 520, fontSize: 13, lineHeight: 1.6, color: 'rgba(60,50,40,0.82)', padding: '0 8px' }}>
          <b>When to use</b> — lightweight quick-actions, emphasize streak/status, not much deep content.<br/>
          <b>Dimensions</b> — identity chip + 4 stacked action bubbles, staggered.<br/>
          <b>Trade-off</b> — vertical space hungry; needs a minimum app height.
        </div>
      </DCSection>

      <DCSection title="Shared behaviors" subtitle="Applies to all three.">
        <div style={{ padding: '0 60px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, maxWidth: 1200, fontSize: 13, lineHeight: 1.6, color: 'rgba(60,50,40,0.82)' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Open / close</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>Tap Profile button → bubble fades+scales in from the button origin (~180ms)</li>
              <li>Tap the button again → closes</li>
              <li>Tap anywhere outside (on the soft scrim) → closes</li>
              <li>Esc → closes</li>
            </ul>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Stacking with workspace</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>Workspace panes stay visible underneath — no full dim</li>
              <li>Soft scrim (≈4% dim + 1.5px blur) just signals "pause"</li>
              <li>Nav bar stays on top; active button gets filled state so you know which bubble belongs to what</li>
              <li>Extends identically to Home, Settings — swap the contents, keep the container</li>
            </ul>
          </div>
        </div>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
