<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Home (calm)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-hybrid.jsx"></script>
<script type="text/babel" src="home-quiet.jsx"></script>

<script type="text/babel">
function AB({ width, height, children, label }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden', position: 'relative' }}>
        {children}
        <HybridNav open={[]} hoverBar={false} activeTab="home"/>
      </div>
    </DCArtboard>
  );
}

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Home · calmer directions</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.72)', maxWidth: 860, lineHeight: 1.55 }}>
          Invitational, not task-heavy. Keeps the things you liked — currently-reading with progress, book covers, recent dictionary lookups — and drops the due-today pressure. Adds a
          welcoming prompt and a quiet introduction to the features. Each variant opens with a "Where would you like to start?" question.
        </div>
      </div>

      <DCSection title="V1 · Quiet" subtitle="Single hero column, centered. Big welcoming headline, a spacious 5-destination row of softly-styled buttons, then currently-reading and recent lookups below. Lots of air, no numbers shouting at you.">
        <AB width={1220} height={940} label="V1  quiet"><HomeQuiet/></AB>
      </DCSection>

      <DCSection title="V2 · Field guide" subtitle="Two columns. Left is the field guide — prose explaining how the bottom nav works + a little demo illustration of the nav itself, then a tidy list of every feature with its short description. Right is personal state: currently reading + progress rail across all books + recent lookups. Reads like the opening chapter of a handbook.">
        <AB width={1220} height={980} label="V2  field guide"><HomeFieldGuide/></AB>
      </DCSection>

      <DCSection title="V3 · Atrium" subtitle="Centered greeting at the top. Currently-reading as a wide calm strip with a per-book progress rail. Below, a 2×2 grid of feature cards — each with a tiny illustrative demo (highlighted word in prose, a kanji breakdown, a deck of mini cards, a review card with answer buttons) — and a tucked recent-lookups + nav-demo sidebar on the right.">
        <AB width={1220} height={960} label="V3  atrium"><HomeAtrium/></AB>
      </DCSection>

      <DCSection title="What changed from the previous Home set" subtitle="">
        <div style={{ padding: '0 60px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, maxWidth: 1200, fontSize: 13, lineHeight: 1.7, color: 'rgba(60,50,40,0.82)' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Dropped</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>"Due today" deck counters + study-all CTA</li>
              <li>Streak / days / words-learned statistics chips</li>
              <li>"Good afternoon, you're on a 14-day streak" pressure copy</li>
              <li>Decks-overview rows on the Home page</li>
              <li>Library-as-carousel sections (moved to Library page)</li>
            </ul>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Kept & added</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li><b>Kept</b> — last-read book as Currently reading, with progress</li>
              <li><b>Kept</b> — recent dictionary lookups (soft strip, no counts)</li>
              <li><b>Added</b> — "Where would you like to start?" prompt</li>
              <li><b>Added</b> — quiet row / list / grid of feature destinations</li>
              <li><b>Added</b> — mini demo of the bottom nav to orient new users</li>
              <li><b>Added</b> — tiny illustrative demos inside feature cards (V3)</li>
              <li><b>Added</b> — multi-book progress rail across the Library (V1, V2, V3)</li>
            </ul>
          </div>
        </div>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
