<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Full Profile Bubble</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-explorations.jsx"></script>
<script type="text/babel" src="nav-bubbles.jsx"></script>
<script type="text/babel" src="profile.jsx"></script>
<script type="text/babel" src="nav-bubble-full.jsx"></script>

<script type="text/babel">
function AB({ width, height, children, label }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden' }}>{children}</div>
    </DCArtboard>
  );
}

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Profile · full bubble</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.72)', maxWidth: 820, lineHeight: 1.55 }}>
          The bubble is now the full profile page — not a shortcut. 880×620 floating above the workspace, with cover band, identity header,
          two-column body (Account + Shared decks · At-a-glance + Currently reading + Actions). Still tap-outside to dismiss,
          still anchored to the Profile button below. Scrollable internally if content grows.
        </div>
      </div>

      <DCSection title="Full profile bubble · over 2-pane workspace">
        <AB width={1220} height={780} label="full profile bubble">
          <BubbleWS>
            <div onClick={() => {}} style={{ position: 'absolute', inset: 0, zIndex: 35, background: 'rgba(20,16,12,0.06)', backdropFilter: 'blur(2px)', WebkitBackdropFilter: 'blur(2px)' }}/>
            <FullProfileBubble/>
            <div style={{ position: 'absolute', bottom: 18, left: '50%', transform: 'translateX(-50%)', zIndex: 45 }}>
              <NavInBubble openTab="profile"/>
            </div>
          </BubbleWS>
        </AB>
      </DCSection>

      <DCSection title="What got trimmed from the fullscreen profile" subtitle="Kept the core, dropped what doesn't belong in a bubble.">
        <div style={{ padding: '0 60px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, maxWidth: 1200, fontSize: 13, lineHeight: 1.7, color: 'rgba(60,50,40,0.82)' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Kept</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>Cover band + kamon avatar (editable)</li>
              <li>Name, handle, join date, level badge, streak, words</li>
              <li>Account fields: display name, email, language level, theme</li>
              <li>Shared decks table (3 rows)</li>
              <li>At-a-glance stats (streak · words · studied)</li>
              <li>Currently reading (2 books, compact)</li>
              <li>Quick actions: highlights, preferences, sign out</li>
            </ul>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Trimmed / deferred to settings</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>Full kamon avatar-picker modal (keeps the pencil button, opens modal on click)</li>
              <li>Icon rail sidebar — unnecessary in a bubble context</li>
              <li>Expanded book list — shows 2 current reads; "My library" lives in the workspace pane</li>
              <li>Deep settings panes (notifications, sync details) — surfaced via the "Preferences" action row</li>
              <li>Full deck management — surfaced via "Manage" link</li>
            </ul>
          </div>
        </div>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
