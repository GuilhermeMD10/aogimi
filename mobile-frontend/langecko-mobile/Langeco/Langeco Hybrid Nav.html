<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langeco — Hybrid Bottom Nav</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0eee9; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="book-data.jsx"></script>
<script type="text/babel" src="nav-explorations.jsx"></script>
<script type="text/babel" src="nav-hybrid.jsx"></script>

<script type="text/babel">
function AB({ width, height, children, label }) {
  return (
    <DCArtboard label={label} width={width} height={height}>
      <div style={{ width: '100%', height: '100%', overflow: 'hidden' }}>{children}</div>
    </DCArtboard>
  );
}
function WS({ open = ['reader', 'dict'], children }) {
  return (
    <div className="theme-default" style={{ width: '100%', height: '100%', background: 'var(--bg)', position: 'relative', overflow: 'hidden', display: 'flex' }}>
      {open.map((k, i) => <PreviewPane key={i} paneKey={k} flex={k === 'reader' ? 2 : 1}/>)}
      {children}
    </div>
  );
}
function Row({ label, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ fontSize: 11, color: 'rgba(60,50,40,0.65)', letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 600, paddingLeft: 4 }}>{label}</div>
      <div style={{ display: 'flex', gap: 20, alignItems: 'flex-start', flexWrap: 'wrap' }}>{children}</div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 30px' }}>
        <div style={{ fontSize: 42, fontWeight: 500, color: 'rgba(30, 22, 15, 0.92)', letterSpacing: '-0.02em', marginBottom: 6, fontFamily: 'Instrument Serif, serif' }}>Hybrid bottom nav</div>
        <div style={{ fontSize: 14, color: 'rgba(60,50,40,0.72)', maxWidth: 820, lineHeight: 1.55 }}>
          One button per workspace item — the same button toggles the pane, shows active state, and serves as the
          draggable chip. Resting: just an icon with a color dot if active. On bar hover: the whole bar expands,
          every workspace button grows to show <b>drag handle · icon · label · color ball · order pip</b>.
          Non-workspace items (Home · Profile · Settings) stay as compact icons, never expand, never draggable.
        </div>
      </div>

      <DCSection title="Anatomy" subtitle="Left cluster (workspace, draggable/toggleable) · divider · right cluster (non-workspace, plain tabs). Open panes sort to the front; unopened ones trail behind at reduced opacity.">
        <Row label="Resting — nothing hovered (2 panes open)">
          <AB width={1220} height={540} label="resting · 2 open"><WS><HybridNav/></WS></AB>
        </Row>
        <Row label="Hover bar — all workspace buttons expand simultaneously">
          <AB width={1220} height={540} label="hover bar · expanded"><WS><HybridNav hoverBar/></WS></AB>
        </Row>
        <Row label="Dragging Reader — reorder feedback on the expanded chip">
          <AB width={1220} height={540} label="dragging reader"><WS><HybridNav hoverBar dragKey="reader"/></WS></AB>
        </Row>
        <Row label="3 panes open — order pip shows 1/2/3 in the active cluster">
          <AB width={1220} height={540} label="3 open"><WS open={['reader', 'dict', 'decks']}><HybridNav open={['reader', 'dict', 'decks']} hoverBar/></WS></AB>
        </Row>
        <Row label="No panes open — workspace cluster is dormant, profile tab active">
          <AB width={1220} height={540} label="nothing open"><WS open={[]}><HybridNav open={[]} activeTab="profile"/></WS></AB>
        </Row>
        <Row label="Collapsed to a ball">
          <AB width={1220} height={540} label="ball"><WS><HybridBall/></WS></AB>
        </Row>
      </DCSection>

      <DCSection title="Reading the states" subtitle="What signals what.">
        <div style={{ padding: '0 60px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, maxWidth: 1200, fontSize: 13, lineHeight: 1.6, color: 'rgba(60,50,40,0.82)' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Workspace button (hybrid)</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li><b>Icon only</b> · pane is closed</li>
              <li><b>Icon + tinted bg + dot below</b> · pane is open</li>
              <li><b>Bar hovered</b> → expands to <b>⋮⋮ icon label ● 1</b> — drag handle, label, color ball, order pip</li>
              <li><b>Dragging</b> → ghosted with a dashed outline in the item's own color</li>
              <li><b>Click</b> toggles · <b>drag</b> reorders in the open stack</li>
            </ul>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(30,22,15,0.85)', marginBottom: 8 }}>Non-workspace button</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              <li>Always compact 32×32 icon, muted tint</li>
              <li>Active tab gets a subtle tinted background</li>
              <li>Never expands, never draggable, no color dot</li>
              <li>Lives after a vertical divider to signal the different role</li>
              <li>Home · Profile · Settings (extend as needed)</li>
            </ul>
          </div>
        </div>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
